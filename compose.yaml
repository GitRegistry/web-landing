x-deploy-agent:
  enabled: true
  force_redeploy: true
  clean_deploy: false
  descriptor: public-web

services:
  web-kopi:
    build:
      context: ./kopi
    environment:
      MESSAGE_API_KEY: ${MESSAGE_API_KEY:-changeme}
    labels:
      caddy: "kopi.paluv.de"
      caddy.reverse_proxy: "{{upstreams 80}}"
      homepage.group: "Deployments"
      homepage.name: "Kopi"
      homepage.icon: "globe"
      homepage.href: "https://kopi.paluv.de"
      homepage.description: "Kopi landing page"
    networks:
      - public

  web-pilotary:
    build:
      context: ./pilotary
    environment:
      MESSAGE_API_KEY: ${MESSAGE_API_KEY:-changeme}
    labels:
      caddy: "pilotary.com, pilotary.de, pilotary.paluv.de"
      caddy.reverse_proxy: "{{upstreams 80}}"
      homepage.group: "Deployments"
      homepage.name: "Pilotary"
      homepage.icon: "airplane"
      homepage.href: "https://pilotary.com"
      homepage.description: "Pilotary landing page"
    networks:
      - public

  web-paluv:
    build:
      context: ./paluv
    environment:
      MESSAGE_API_KEY: ${MESSAGE_API_KEY:-changeme}
    labels:
      caddy: "paluv.de, www.paluv.de"
      caddy.reverse_proxy: "{{upstreams 80}}"
      homepage.group: "Deployments"
      homepage.name: "Paluv"
      homepage.icon: "airplane"
      homepage.href: "https://paluv.de"
      homepage.description: "Paluv landing page"
    networks:
      - public

  web-fest-map:
    build:
      context: ./fest-map
    labels:
      caddy: "festmap.paluv.de"
      caddy.reverse_proxy: "{{upstreams 80}}"
      homepage.group: "Deployments"
      homepage.name: "Fest Map"
      homepage.icon: "airplane"
      homepage.href: "https://festmap.paluv.de"
      homepage.description: "Fest Platz Map"
    networks:
      - public

  web-ul-diplom:
    build:
      context: ./ul-diplom
    labels:
      caddy: "diplom.paluv.de"
      caddy.reverse_proxy: "{{upstreams 80}}"
      homepage.group: "Deployments"
      homepage.name: "UL Diplom"
      homepage.icon: "certificate"
      homepage.href: "https://diplom.paluv.de"
      homepage.description: "UL diploma GPX print generator"
    networks:
      - public

networks:
  public:
    external: true
